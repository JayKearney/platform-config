name: Platform audit

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  network:
    name: Network (VPC overlaps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check VPC ranges in Terraform
        uses: JayKearney/infradoctor@v1
        with:
          args: network check terraform/ --known terraform/known-ranges.txt

  services:
    name: Services (versions and dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build service inventory from Helm values
        id: inventory
        run: bash scripts/build-inventory.sh services.yaml

      - name: Version drift
        uses: JayKearney/infradoctor@v1
        with:
          args: versions services.yaml

      - name: Dependencies
        if: ${{ !cancelled() && steps.inventory.outcome == 'success' }}
        uses: JayKearney/infradoctor@v1
        with:
          args: deps services.yaml